spring.application.name=library-management-system

# MariaDB connection
spring.datasource.url=jdbc:mariadb://localhost:3306/library_management_system
spring.datasource.username=root
spring.datasource.password=

# JPA configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Keep database access inside service transactions, not during response serialization.
spring.jpa.open-in-view=false

# Server
server.port=8080

# JWT. Production deployments MUST set JWT_SECRET to a persistent Base64-encoded
# 256-bit key. When unset, a random per-start key is generated for local runs/tests only.
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
jwt.issuer=${JWT_ISSUER:library-management-system}

# Frontend origin allowed by CORS (override with CORS_ORIGIN)
cors.allowed-origins=${CORS_ORIGIN:http://localhost:5173}